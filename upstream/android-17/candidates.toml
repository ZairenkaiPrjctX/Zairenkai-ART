categories = ["runtime_correctness", "architecture_abi"]
decision = "adopt"
rationale = "r1's Arm64 FromCppDefines() sets lse only if __ARM_ARCH_8_1A__ or __ARM_ARCH_8_2A__ is defined. Clang does not define those macros for any -march tested (NDK r27d clang 18.0.4: armv8-a through armv9-a), so a build for an LSE-capable target reports '-lse' and mismatches the dex2oat features, as the commit message shows. __ARM_FEATURE_ATOMICS is the ACLE macro and is defined for armv8.1-a and later."
