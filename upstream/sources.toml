# Pinned ART upstreams for Zairenkai-ART. Updated only by a reviewed change
# (see docs/UPSTREAM_UPDATE_POLICY.md); `tools/art_upstream.py refs` reports drift.
schema_version = 1

[release.android-17]
# API level 37: libartbase/base/sdk_version.h at android-17.0.0_r1 defines kC = 37u as the
# newest SdkVersion.
api_level = 37
# Canonical baseline: the AOSP release tag android-17.0.0_r1. All three ROM forks are built
# directly on it. android17-security-release is a *sibling* branch (common ancestor
# d9ee3abab2): it adds the security fix 70be2043e6 but lacks r1's a6f18f6667 and 11b4b3c68c,
# so it is tracked as a reference source and its fix is adopted as a patch.
baseline = "aosp"
fork_point = "b753cf97923c3695338d21466fa14c57b480a59a"

